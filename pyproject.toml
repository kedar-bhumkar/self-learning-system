[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learned"
version = "0.1.0"
description = "Local learned-memory system for Claude Code"
requires-python = ">=3.13"
dependencies = ["typesafe-sdk", "sentence-transformers", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls the live Jev API (needs TYPESAFE_API_KEY)"]
